[workspace]
resolver = "3"
members = ["crates/srm-core", "crates/srm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
codegen-units = 1
lto = "thin"

# Les tests de génération sont lourds : on optimise aussi en mode test.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
